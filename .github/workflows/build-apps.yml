# Fork-only: builds the desktop apps from my-build and publishes them as a
# GitHub Release on this fork. The Linux AppImage updates itself from these
# releases; the unsigned macOS app needs a manual reinstall.
name: Build apps

on:
  push:
    branches: [my-build]
  workflow_dispatch:

concurrency:
  group: build-apps
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'samer2373/t3code'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac, os: macos-14, platform: mac, target: dmg, arch: arm64, rust: aarch64-apple-darwin }
          - { name: linux, os: ubuntu-24.04, platform: linux, target: AppImage, arch: x64, rust: x86_64-unknown-linux-gnu }
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Version
        id: v
        run: echo "version=$(jq -r .version apps/desktop/package.json)-fork.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Linux libraries
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      # Same public relay config the official preview builds use.
      - name: Public relay config
        run: |
          for k in CLERK_PUBLISHABLE_KEY CLERK_JWT_TEMPLATE CLERK_CLI_OAUTH_CLIENT_ID RELAY_URL; do
            echo "T3CODE_$k=$(sed -n "s|^T3CODE_$k=||p" .env.example)" >> "$GITHUB_ENV"
          done

      - run: node scripts/update-release-package-versions.ts "${{ steps.v.outputs.version }}"
      - run: vp run build:desktop
      - name: Resource monitor
        run: |
          rustup target add ${{ matrix.rust }}
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target ${{ matrix.rust }}

      - name: Package
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: true
        run: >
          node scripts/build-desktop-artifact.ts
          --platform ${{ matrix.platform }} --target ${{ matrix.target }} --arch ${{ matrix.arch }}
          --build-version "${{ steps.v.outputs.version }}" --skip-build --verbose

      - name: Collect
        run: |
          mkdir publish
          for f in release/*.dmg release/*.zip release/*.AppImage release/*.blockmap release/*.yml; do
            [ -e "$f" ] && [ "$(basename "$f")" != builder-debug.yml ] && cp "$f" publish/
          done
          ls -la publish

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: publish/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "my-build-${{ github.run_number }}" assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "My build #${{ github.run_number }}" \
            --notes "Built from $GITHUB_SHA (my-build): latest upstream stable release plus my features."
