# Fork-only: builds the desktop and Android apps from my-build and publishes them as a
# GitHub Release on this fork. The Linux AppImage updates itself from these
# releases; the unsigned macOS app needs a manual reinstall.
name: Build apps

on:
  push:
    branches: [my-build]
  workflow_dispatch:
    inputs:
      android:
        description: Also build the Android APK (slow)
        type: boolean
        default: true

concurrency:
  group: build-apps
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'samer2373/t3code'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac, os: macos-14, platform: mac, target: dmg, arch: arm64, rust: aarch64-apple-darwin }
          - { name: linux, os: ubuntu-24.04, platform: linux, target: AppImage, arch: x64, rust: x86_64-unknown-linux-gnu }
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Version
        id: v
        run: echo "version=$(jq -r .version apps/desktop/package.json)-fork.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Linux libraries
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      # Same public relay config the official preview builds use.
      - name: Public relay config
        run: |
          for k in CLERK_PUBLISHABLE_KEY CLERK_JWT_TEMPLATE CLERK_CLI_OAUTH_CLIENT_ID RELAY_URL; do
            echo "T3CODE_$k=$(sed -n "s|^T3CODE_$k=||p" .env.example)" >> "$GITHUB_ENV"
          done

      - run: node scripts/update-release-package-versions.ts "${{ steps.v.outputs.version }}"
      - run: vp run build:desktop
      - name: Resource monitor
        run: |
          rustup target add ${{ matrix.rust }}
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target ${{ matrix.rust }}

      - name: Package
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: true
        run: >
          node scripts/build-desktop-artifact.ts
          --platform ${{ matrix.platform }} --target ${{ matrix.target }} --arch ${{ matrix.arch }}
          --build-version "${{ steps.v.outputs.version }}" --skip-build --verbose

      - name: Collect
        run: |
          mkdir publish
          for f in release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.blockmap release/*.yml; do
            [ -e "$f" ] && [ "$(basename "$f")" != builder-debug.yml ] && cp "$f" publish/
          done
          ls -la publish

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: publish/*
          if-no-files-found: error

  # Installs beside the official app (package com.t3tools.t3code.preview), signed
  # with a private keystore (secrets) so every build updates the previous one in place.
  android:
    if: github.repository == 'samer2373/t3code' && inputs.android != false
    name: Build android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APP_VARIANT: preview
      EXPO_NO_GIT_STATUS: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile...
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.4
      - name: Public relay config
        run: |
          get() { sed -n "s|^$1=||p" .env.example; }
          {
            echo "T3CODE_RELAY_URL=$(get T3CODE_RELAY_URL)"
            echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=$(get T3CODE_CLERK_PUBLISHABLE_KEY)"
            echo "EXPO_PUBLIC_CLERK_JWT_TEMPLATE=$(get T3CODE_CLERK_JWT_TEMPLATE)"
          } >> "$GITHUB_ENV"
      - name: Prebuild
        working-directory: apps/mobile
        run: vp exec expo prebuild --clean --platform android
      - name: Sign with the private keystore
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64" && test -n "$ANDROID_KEYSTORE_PASSWORD"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          python3 - <<'PY'
          p = "app/build.gradle"
          s = open(p).read()
          a = s.index("signingConfigs {") + len("signingConfigs {")
          s = s[:a] + """
              release {
                  storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias "mybuild"
                  keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
              }""" + s[a:]
          b = s.index("buildTypes {")
          r = s.index("release {", b)
          c = s.index("signingConfigs.debug", r)
          s = s[:c] + "signingConfigs.release" + s[c + len("signingConfigs.debug"):]
          open(p, "w").write(s)
          PY
          grep -n "signingConfigs.release" app/build.gradle
      - name: Gradle release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Check signer
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs apps/mobile/android/app/build/outputs/apk/release/*.apk | tee /dev/stderr | grep -q "CN=samer2373 personal build"
      - run: mkdir publish && cp apps/mobile/android/app/build/outputs/apk/release/*.apk "publish/T3-Code-Preview-android-fork.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: publish/*
          if-no-files-found: error

  release:
    needs: [build, android]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "my-build-${{ github.run_number }}" assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "My build #${{ github.run_number }}" \
            --notes "Built from $GITHUB_SHA (my-build): latest upstream stable release plus my features."
