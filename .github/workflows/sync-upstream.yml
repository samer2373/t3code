# Fork-only: keeps `main` a mirror of pingdotgg/t3code and merges it into `my-build`.
# On a merge conflict it stops, leaves my-build untouched and opens an issue.
name: Sync upstream

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: sync-upstream

jobs:
  sync:
    if: github.repository == 'samer2373/t3code'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: my-build
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - name: Sync
        run: |
          set -euo pipefail
          git config user.name "upstream-sync[bot]"
          git config user.email "upstream-sync@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main

          # main is a pure mirror: fast-forward only, never rewritten.
          git push origin refs/remotes/upstream/main:refs/heads/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "my-build already contains upstream/main"
          elif git merge --no-edit upstream/main; then
            git push origin my-build
          else
            git merge --abort
            if [ -z "$(gh issue list --label sync-blocked --state open --json number --jq '.[0].number')" ]; then
              gh label create sync-blocked --force >/dev/null
              gh issue create --label sync-blocked \
                --title "Upstream sync blocked by a merge conflict" \
                --body "Merging pingdotgg/t3code main into my-build conflicts. my-build is unchanged. Resolve locally: git switch my-build && git merge upstream/main. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
            exit 1
          fi

          # Clean again: close any earlier blocked issue.
          for n in $(gh issue list --label sync-blocked --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Sync is clean again."
          done
